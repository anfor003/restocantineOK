<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre Menu | Resto-Cantine OK</title>

    <meta name="description" content="Consultez le menu en ligne du Resto-Cantine OK à Sabrevois.">
    <meta name="robots" content="noindex, follow"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles spécifiques pour la page Menu QR */
        .menu-bg {
            background: linear-gradient(rgba(43, 69, 97, 0.9), rgba(43, 69, 97, 0.95)), url('assets/IMG_4424.JPG') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: white;
        }

        .menu-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            border: 4px solid var(--orange);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: var(--dark-text);
        }

        .btn-menu-download {
            background-color: var(--orange);
            color: white;
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            border: 2px solid var(--cream);
            padding: 12px 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-menu-download:hover {
            background-color: #c96f20;
            color: var(--cream);
            transform: translateY(-2px);
        }

        .pdf-container {
            position: relative;
            width: 100%;
            height: 65vh;
            border: 3px solid var(--navy);
            border-radius: 10px;
            overflow: hidden;
        }

        .back-home {
            color: var(--cream);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }
        
        .back-home:hover {
            color: var(--orange);
        }
    </style>
</head>

<body class="menu-bg d-flex flex-column justify-content-between">

    <main class="container py-4 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 text-center">
                
                <a href="index.html">
                    <img src="assets/Logo1.6AvecFond.svg" alt="Logo Resto-Cantine OK" class="mb-3 shadow-sm" style="max-width: 140px; border-radius: 50%; border: 3px solid var(--orange);">
                </a>

                <div class="menu-card p-4 p-sm-5 mb-4">
                    <h1 class="display-5 fw-bold mb-2" style="color: var(--navy);">Notre Menu</h1>
                    <p class="lead mb-4">Découvrez nos spécialités et nos rafraîchissements au bord de l'eau !</p>
                    
                    <div class="mb-4">
                        <a href="assets/Cantine OKmenu.pdf" target="_blank" class="btn btn-menu-download w-100 py-3">
                            Format PDF ↗
                        </a>
                        <small class="text-muted d-block mt-2">Cliquez pour ouvrir, zoomer ou télécharger le menu.</small>
                    </div>

                    <div class="pdf-container d-none d-sm-block">
                        <iframe src="assets/Cantine OKmenu.pdf" width="100%" height="100%" style="border: none;">
                            <p>Votre navigateur ne prend pas en charge l'affichage des PDF. <a href="assets/Cantine OKmenu.pdf">Cliquez ici pour le télécharger.</a></p>
                        </iframe>
                    </div>
                </div>

                <p class="mb-0">
                    <a href="index.html" class="back-home">← Retour au site web</a>
                </p>

            </div>
        </div>
    </main>

    <footer class="text-center py-3" style="background-color: rgba(43, 69, 97, 0.4); border-top: none;">
        <div class="container text-white-50 fs-7">
            <p class="mb-0">© 2026 Resto-Cantine OK. Tous droits réservés.</p>
            <p class="mb-0">
                Fait par <a href="https://fortierwebdesign.ca/" class="text-white text-decoration-none fw-bold"
                    target="_blank">Fortier Web Design</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
